name: GeoRisiko G2.1
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: GitHub Pages vom Hauptbranch veröffentlichen
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    # Browser binaries and Linux libraries match the pinned Playwright version.
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node tests/gate.mjs
      - run: npm test
      - name: Kamerafahrt aufnehmen und Bildfolge auswerten
        run: |
          if ! command -v ffmpeg >/dev/null; then apt-get update && apt-get install -y ffmpeg; fi
          npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browsertests
          path: test-results/
      - run: npm run package && node tests/packages.mjs
      - name: Unterricht-ZIP zum direkten Download bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/GeoRisiko-G2.1-Unterricht.zip
          archive: false
          if-no-files-found: error
      - name: SCORM-1.2-ZIP zum direkten Download bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/GeoRisiko-G2.1-SCORM-1.2.zip
          archive: false
          if-no-files-found: error
      - name: Sichtpruefung-ZIP zum direkten Download bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: artifacts/GeoRisiko-G2.1-Sichtpruefung.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
        with:
          path: dist
  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

