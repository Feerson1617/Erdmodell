name: GeoRisiko · Browserregression
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run standalone
      - run: npm run test:data
      - uses: actions/upload-artifact@v4
        with:
          name: Produktionsbuild
          path: |
            dist/
            artifacts/GeoRisiko-G6.4.1-Web-Test.html
  browser:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [raum, atlas, modelle, bestand, freitag]
    container: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: Produktionsbuild
      - if: matrix.suite != 'freitag'
        env:
          G641_GROUP: ${{ matrix.suite }}
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/g641-product.mjs
      - if: matrix.suite == 'freitag'
        run: |
          if ! command -v ffmpeg >/dev/null; then apt-get update && apt-get install -y ffmpeg; fi
          node tests/freitag.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-${{ matrix.suite }}
          path: test-results/
