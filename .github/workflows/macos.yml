name: GeoRisiko · macOS ARM64
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mac:
    name: Apple Silicon · App, DMG und Offline-Prüfung
    runs-on: macos-26
    timeout-minutes: 110
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Ad-hoc identity '-' uses no signing secrets or Developer ID.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mac:build
      - run: bash scripts/mount-macos.sh
      - name: Bedienfilm vorbereiten
        run: command -v ffmpeg || brew install ffmpeg
      - name: Installierte App und Einzeldatei am selben Mac bedienen und messen
        env:
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/mac-abnahme.mjs
      - name: Fachliche Messprotokolle der exportierten HTML erzeugen
        env:
          G6_NATIVE_GPU: '1'
        run: |
          python3 scripts/g52/product-check.py artifacts/macos/GeoRisiko-G6-macOS-arm64-app.zip artifacts/GeoRisiko-G6-Web-Test.html test-results/mac/G52/Ressourcen.json
          npx playwright install chromium
          G51_PHYSICS_LOG=test-results/mac/G51/Mechanik.json node tests/g51-physics.mjs
          node tests/g51-time.mjs > test-results/mac/G51/Zeitreise.log
          G521_OUT=test-results/mac/G521 node tests/g521-observation.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-storage.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-water.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-geometry.mjs
      - name: Gesicherten G5.2.1-Stand auf demselben Mac bauen
        uses: actions/checkout@v4
        with:
          ref: 439a6b69e250060ffb39f8ab9aad653775c4289d
          path: .scratch/g521-reference
          persist-credentials: false
      - name: Vergleich der Originalbilder, Modellphasen und Grafikprofile
        env:
          G6_CHROME: '1'
          G6_PERF: '1'
        run: |
          npm --prefix .scratch/g521-reference run build
          npm --prefix .scratch/g521-reference run standalone
          G6_OUT=test-results/mac/G6/Vorher node tests/g6-gallery.mjs .scratch/g521-reference/artifacts/GeoRisiko-G5.2.1-Web-Test.html
          G6_OUT=test-results/mac/G6/Nachher node tests/g6-gallery.mjs artifacts/GeoRisiko-G6-Web-Test.html
          G6_STAGE=Profile G6_PROFILE=classroom G6_OUT=test-results/mac/G6/Unterricht node tests/g6-gallery.mjs artifacts/GeoRisiko-G6-Web-Test.html
          G6_STAGE=Profile G6_PROFILE=maximum G6_OUT=test-results/mac/G6/Maximal node tests/g6-gallery.mjs artifacts/GeoRisiko-G6-Web-Test.html
      - run: python3 scripts/g6/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6-Sichtpruefung.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6-macOS-arm64-app.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6-Web-Test.html
          archive: false
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-protokoll
          path: |
            test-results/mac/*.log
            test-results/mac/*.json
            test-results/mac/G5/*.json
            test-results/mac/G52/*.json
            test-results/mac/G521/*.json
            test-results/mac/G6/*/*.json
