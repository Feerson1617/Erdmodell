name: GeoRisiko · macOS ARM64
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mac:
    name: Apple Silicon · App, DMG und Offline-Prüfung
    runs-on: macos-26
    timeout-minutes: 110
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Ad-hoc identity '-' uses no signing secrets or Developer ID.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mac:build
      - run: bash scripts/mount-macos.sh
      - name: Bedienfilm vorbereiten
        run: command -v ffmpeg || brew install ffmpeg
      - name: Installierte App und Einzeldatei am selben Mac bedienen und messen
        env:
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/mac-abnahme.mjs
      - name: Fachliche Messprotokolle der exportierten HTML erzeugen
        env:
          G6_NATIVE_GPU: '1'
        run: |
          python3 scripts/g52/product-check.py artifacts/macos/GeoRisiko-G6.3-macOS-arm64-app.zip artifacts/GeoRisiko-G6.3-Web-Test.html test-results/mac/G52/Ressourcen.json
          npx playwright install chromium
          G51_PHYSICS_LOG=test-results/mac/G51/Mechanik.json node tests/g51-physics.mjs
          node tests/g51-time.mjs > test-results/mac/G51/Zeitreise.log
          G521_OUT=test-results/mac/G521 node tests/g521-observation.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-storage.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-water.mjs
          G521_OUT=test-results/mac/G521 node tests/g521-geometry.mjs
          G61_OUT=test-results/mac/G61 node tests/g61-process.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6.3-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6.3-macOS-arm64-app.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6.3-Web-Test.html
          archive: false
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-protokoll
          path: |
            test-results/mac/*.log
            test-results/mac/*.json
            test-results/mac/SHA256.txt
            test-results/mac/G51/*.json
            test-results/mac/G51/Zeitreise.log
            test-results/mac/G52/*.json
            test-results/mac/G521/*.json
            test-results/mac/G61/*.json
  classroom:
    name: Unterricht und Originalaufnahmen · G6.2 und G6.3
    runs-on: macos-26
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      G6_NATIVE_GPU: '1'
      G63_OUT: test-results/mac/G63
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: 2595f33587231e442ac02dca3afb73f92f1c9e68
          path: .scratch/g62-reference
          persist-credentials: false
      - run: command -v ffmpeg || brew install ffmpeg
      - name: Für alle G6.3-Vergleiche dieselbe Chromium-Version installieren
        run: npx playwright install chromium
      - name: Beide versandfertigen Einzeldateien bilden
        run: |
          npm --prefix .scratch/g62-reference run build
          npm --prefix .scratch/g62-reference run standalone
          npm run build
          npm run standalone
      - run: node tests/g63-science.mjs
      - name: Sieben Unterrichtsabläufe und acht zusammenhängende Filme
        run: |
          node tests/g63-classroom.mjs .scratch/g62-reference/artifacts/GeoRisiko-G6.2-Web-Test.html --before
          node tests/g63-classroom.mjs artifacts/GeoRisiko-G6.3-Web-Test.html
      - name: Materialanker, verdeckte Flächen und Szenenwechsel
        run: node tests/g63-anchors.mjs artifacts/GeoRisiko-G6.3-Web-Test.html
      - name: Kontrollierter Küstenvergleich bei gleicher Framebufferauflösung
        run: node tests/g63-performance.mjs .scratch/g62-reference/artifacts/GeoRisiko-G6.2-Web-Test.html artifacts/GeoRisiko-G6.3-Web-Test.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unterrichtsprotokoll
          path: |
            test-results/mac/G63/**/*.json
            test-results/mac/G63/**/*.jpg
            !test-results/mac/G63/**/frames-*/**
            test-results/mac/G63/**/*.mp4
  package:
    name: Fachbericht und Sichtprüfung
    runs-on: ubuntu-24.04
    needs: [mac, classroom]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mac-protokoll
          path: test-results/mac
      - uses: actions/download-artifact@v4
        with:
          name: Unterrichtsprotokoll
          path: test-results/mac/G63
      - run: python3 scripts/g63/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6.3-Sichtpruefung.zip
          archive: false
          if-no-files-found: error
