name: GeoRisiko · macOS ARM64
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  G6_NATIVE_GPU: '1'
  TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  mac:
    name: Installierte ARM64-App und 15-Minuten-Dauerlauf
    runs-on: macos-26
    timeout-minutes: 85
    env:
      CSC_FOR_PULL_REQUEST: 'true'
      G642_OUT: test-results/G642/App
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run mac:build
      - run: bash scripts/mount-macos.sh
      - run: python3 scripts/g52/product-check.py artifacts/macos/GeoRisiko-G6.4.2-macOS-arm64-app.zip artifacts/GeoRisiko-G6.4.2-Web-Test.html test-results/G642/Ressourcen.json
      - run: node tests/g642-product.mjs --installed --long
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Pruefung
          path: |
            test-results/mac/installation.log
            test-results/mac/SHA256.txt
            test-results/G642/**/*.json
            test-results/G642/**/*.jpg
            !test-results/G642/App/Profil/**
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6.4.2-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/macos/GeoRisiko-G6.4.2-macOS-arm64-app.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6.4.2-Web-Test.html
          archive: false
          if-no-files-found: error
  classroom:
    name: Offline-HTML · Unterricht A bis F mit Originalfilmen
    runs-on: macos-26
    timeout-minutes: 55
    env:
      G642_FILM: '1'
      G642_OUT: test-results/G642/HTML
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run standalone
      - run: command -v ffmpeg || brew install ffmpeg
      - run: npx playwright install chromium
      - run: node tests/g642-product.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Pruefung
          path: test-results/G642/HTML/
  comparison:
    name: Identischer Renderer · G6.4.1 und G6.4.2
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: 81b4794fa7b1abcbe1d4b781904bcdb5281cb09a
          path: .scratch/g64
      - run: |
          npm --prefix .scratch/g64 run build && npm --prefix .scratch/g64 run standalone
          npm run build && npm run standalone
          npx playwright install chromium
      - run: node tests/g642-compare.mjs .scratch/g64/artifacts/GeoRisiko-G6.4.1-Web-Test.html artifacts/GeoRisiko-G6.4.2-Web-Test.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Direktvergleich
          path: test-results/G642/Vergleich/
  package:
    name: Sichtprüfung und Prüfsummen
    runs-on: ubuntu-24.04
    needs: [mac, classroom, comparison]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Native-Pruefung
          path: test-results/Abnahme/Nativ
      - uses: actions/download-artifact@v4
        with:
          name: Offline-Pruefung
          path: test-results/Abnahme/HTML
      - uses: actions/download-artifact@v4
        with:
          name: Direktvergleich
          path: test-results/Abnahme/Vergleich
      - run: python3 scripts/g642/report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/GeoRisiko-G6.4.2-Sichtpruefung.zip
          archive: false
          if-no-files-found: error
